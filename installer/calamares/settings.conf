# Tom OS experimental Calamares frontend.
# Omarchy's own installer remains the authoritative backend for disk imaging.
modules-search: [ local ]
branding: tom-os
prompt-install: false
dont-chroot: false
oem-setup: false

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - summary
  - exec:
      - shellprocess
  - show:
      - finished
