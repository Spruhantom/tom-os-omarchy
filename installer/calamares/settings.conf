# Tom OS Calamares frontend.
# The actual disk deployment is delegated to Omarchy's supported installer
# because Omarchy installs a prebuilt Btrfs root image, not a conventional
# unpackfs target. Do not replace this handoff with a generic Arch installer
# sequence without implementing and testing a compatible backend.
modules-search: [ local ]

branding: tom-os
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
window-explicitly-closeable: false
quit-at-end: true
allow-cancel: true

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - summary
  - exec:
      - tom-os-installer-handoff
  - show:
      - finished

# Local modules live in /usr/lib/calamares/modules and are installed by the
# Tom OS settings package. The handoff validates the official Omarchy installer
# is available, then launches it instead of pretending Calamares performed
# disk operations it does not know how to do.
