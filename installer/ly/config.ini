# Tom OS Ly configuration. Ly is a TTY login manager.
# Keep the session list compatible with Omarchy's installed Wayland sessions.
animation = none
bigclock = en
blank_box = true
border_fg = 6
clear_password = true
clock = %c
console_dev = /dev/console
default_input = login
default_session = omarchy
default_timeout = 0
fg = 7
hide_borders = false
hide_version_string = true
lang = en
load = true
numlock = true
save = true
session_log = .local/state/ly-session.log
sessiondir = /usr/share/wayland-sessions
shutdown_cmd = /usr/bin/systemctl poweroff
sleep_cmd = /usr/bin/systemctl suspend
text_in_center = true
tty = 2
waylandsessions = /usr/share/wayland-sessions
x_cmd = /usr/bin/X
xauth_cmd = /usr/bin/xauth
xinitrc = ~/.xinitrc
xinitrc_session = startx
